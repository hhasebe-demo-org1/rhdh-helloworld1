apiVersion: apps/v1
kind: Deployment
metadata:
  labels:
    app: helloworld1
  name: helloworld1
spec:
  replicas: 1
  selector:
    matchLabels:
      app: helloworld1
  template:
    metadata:
      labels:
        app: helloworld1
    spec:
      containers:
      - image: quay.io/skitamur/hello-world:latest 
        name: helloworld1
        ports:
        - containerPort: 3000
          protocol: TCP
