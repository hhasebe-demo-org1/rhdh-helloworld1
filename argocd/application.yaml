apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: helloworld1
  namespace: openshift-gitops
  labels:
    app.kubernetes.io/instance: helloworld1-init
spec:
  project: default 
  source:
    repoURL: https://github.com/hhasebe-demo-org1/rhdh-helloworld1.git
    targetRevision: develop
    path: ./manifests
  destination:
    server: https://kubernetes.default.svc
    namespace: helloworld1
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
    - CreateNamespace=true
    - RespectIgnoreDifferences=true
    - ApplyOutOfSyncOnly=true
    retry:
      limit: 10
      backoff:
        duration: 5s
        factor: 2
        maxDuration: 5m
